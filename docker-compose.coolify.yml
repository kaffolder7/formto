# Use this file on its own with Coolify's Docker Compose build pack.
# Do not merge with docker-compose.yml, which publishes host ports for Caddy.
services:
  postgres:
    build:
      context: .
      dockerfile: docker/coolify/postgres.Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DB: formto
      POSTGRES_USER: formto
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formto -d formto"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: formto
      DB_USER: formto
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      JWT_SECRET: ${SERVICE_PASSWORD_64_JWT}
      CORS_ORIGIN: ${SERVICE_URL_CADDY}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      FROM_EMAIL: ${FROM_EMAIL:-FormTo <noreply@localhost>}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-10}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  caddy:
    build:
      context: .
      dockerfile: docker/coolify/caddy.Dockerfile
    restart: unless-stopped
    environment:
      - SERVICE_URL_CADDY
    expose:
      - "80"
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
